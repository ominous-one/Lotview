name: Lotview SaaS — CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run check

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
      - run: npm run audit:high

  test-server:
    name: Server Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lotview
          POSTGRES_PASSWORD: lotview_test
          POSTGRES_DB: lotview_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
      - run: npm run test:server
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://lotview:lotview_test@localhost:5432/lotview_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-32-chars-long
          SESSION_SECRET: test-session-secret-32-chars-long
          OPENAI_API_KEY: test-openai-key
          ANTHROPIC_API_KEY: test-anthropic-key

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lotview
          POSTGRES_PASSWORD: lotview_test
          POSTGRES_DB: lotview_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
      - run: npm run test:smoke
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://lotview:lotview_test@localhost:5432/lotview_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-32-chars-long
          SESSION_SECRET: test-session-secret-32-chars-long
          OPENAI_API_KEY: test-openai-key
          ANTHROPIC_API_KEY: test-anthropic-key

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
      - run: npm run test:frontend

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-server, smoke-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: dist/
          retention-days: 7

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Render Staging Proof
    runs-on: ubuntu-latest
    needs: docker-build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && vars.RENDER_STAGING_ENABLED == 'true'
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Verify Render staging configuration
        env:
          RENDER_STAGING_BASE_URL: ${{ vars.RENDER_STAGING_BASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "$RENDER_STAGING_BASE_URL" ]; then
            echo "::error::Missing repository variable RENDER_STAGING_BASE_URL"
            exit 1
          fi

      - name: Trigger Render deploy hook if configured
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail

          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deploy hook accepted."
          else
            echo "Render deploy hook not configured; verifying GitHub auto-deploy against the live staging commit."
          fi

      - name: Verify Render staging serves this commit
        env:
          RENDER_STAGING_BASE_URL: ${{ vars.RENDER_STAGING_BASE_URL }}
          RENDER_EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          base_url="${RENDER_STAGING_BASE_URL%/}"

          wait_for_endpoint() {
            local path="$1"
            local label="$2"

            for attempt in $(seq 1 60); do
              if response="$(curl -fsS --max-time 10 "${base_url}${path}")"; then
                echo "Render ${label} endpoint passed on attempt ${attempt}/60."
                echo "$response"
                return 0
              fi

              echo "Waiting for Render ${label} endpoint attempt ${attempt}/60."
              sleep 10
            done

            echo "::error::Render ${label} endpoint did not pass within timeout: ${base_url}${path}"
            return 1
          }

          wait_for_endpoint "/api/health" "health"
          wait_for_endpoint "/api/ready" "readiness"

          for attempt in $(seq 1 60); do
            if version_response="$(curl -fsS --max-time 10 "${base_url}/api/version")"; then
              VERSION_RESPONSE="$version_response" node <<'NODE'
          const response = process.env.VERSION_RESPONSE || "{}";
          const expected = process.env.RENDER_EXPECTED_COMMIT;
          let body;

          try {
            body = JSON.parse(response);
          } catch (error) {
            console.error(`::error::Render version endpoint returned invalid JSON: ${error instanceof Error ? error.message : String(error)}`);
            process.exit(1);
          }

          if (!expected) {
            console.error("::error::Missing expected commit from GitHub Actions.");
            process.exit(1);
          }

          if (body.commit !== expected) {
            console.error(`::error::Render staging is serving commit ${body.commit || "<missing>"} instead of ${expected}.`);
            process.exit(1);
          }

          console.log(`Render staging commit verified: ${body.commit}`);
          NODE
              exit 0
            fi

            echo "Waiting for Render version endpoint attempt ${attempt}/60."
            sleep 10
          done

          echo "::error::Render version endpoint did not expose commit proof within timeout: ${base_url}/api/version"
          exit 1
