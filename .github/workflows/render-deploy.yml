name: Lotview SaaS Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: "20"

jobs:
  verify:
    name: Verify Build and Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lotview
          POSTGRES_PASSWORD: lotview_test
          POSTGRES_DB: lotview_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Server tests
        run: npm run test:server
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://lotview:lotview_test@localhost:5432/lotview_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-32-chars-long
          SESSION_SECRET: test-session-secret-32-chars-long
          OPENAI_API_KEY: test-openai-key
          ANTHROPIC_API_KEY: test-anthropic-key
      - name: Smoke tests
        run: npm run test:smoke
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://lotview:lotview_test@localhost:5432/lotview_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-32-chars-long
          SESSION_SECRET: test-session-secret-32-chars-long
          OPENAI_API_KEY: test-openai-key
          ANTHROPIC_API_KEY: test-anthropic-key
      - name: Production build
        run: npm run build
      - name: Docker build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: lotview:test
