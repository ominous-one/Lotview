# Lotview SaaS — Render Blueprint
#
# Reconciled to match the actual deployed state on Render:
#   - One combined web service named `lotview` that serves HTTP *and* runs
#     the scheduler/queue worker in-process. This is appropriate for a
#     low-volume Day-1 deploy and is what is currently live.
#   - Postgres `lotview-db` and Redis `lotview-redis`.
#
# When scale demands it, split out a dedicated worker service by uncommenting
# the worker block below and flipping LOTVIEW_ENABLE_SCHEDULERS to "false"
# on the web service so jobs aren't duplicated. The worker block is preserved
# here as a documented upgrade path, not a live service.

services:
  # ─── Combined Web + Scheduler Service ───
  # Serves HTTP and runs BullMQ workers + schedulers in-process. Lower
  # throughput than the split-service model but cheaper to operate at
  # Day-1 volume.
  - type: web
    name: lotview
    runtime: node
    repo: https://github.com/ominous-one/Lotview
    branch: main
    plan: standard
    numInstances: 1
    healthCheckPath: /api/health
    buildCommand: npm ci --ignore-scripts && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: lotview-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lotview-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: EXTENSION_HMAC_SECRET
        generateValue: true
      - key: GHL_WEBHOOK_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Bootstrap token for the first super-admin create. Auto-generated on
      # first sync. Endpoint self-disables once a super_admin row exists.
      - key: LOTVIEW_BOOTSTRAP_TOKEN
        generateValue: true
      - key: APP_URL
        value: https://app.lotview.ai
      - key: PUBLIC_APP_URL
        value: https://app.lotview.ai
      - key: PUBLIC_API_URL
        value: https://app.lotview.ai
      - key: SYSTEM_BASE_DOMAIN
        value: lotview.ai
      # Schedulers + workers run in-process on this single service.
      - key: LOTVIEW_ENABLE_SCHEDULERS
        value: "true"
      - key: LOTVIEW_SCHEDULER_PROCESS
        value: "web"
      # Patchright CDP stealth tier is opt-in. Flip to "true" once
      # BROWSERLESS_API_KEY is configured.
      - key: LOTVIEW_USE_PATCHRIGHT
        value: "false"
      - key: LOG_FORMAT
        value: "json"
      - key: LOG_LEVEL
        value: "info"
      - key: CORS_ORIGIN
        value: "https://lotview.ai,https://app.lotview.ai,https://www.lotview.ai"
    buildFilter:
      paths:
        - server/**
        - shared/**
        - client/**
        - package.json
        - package-lock.json
        - render.yaml

  # ─── Dedicated Worker (DISABLED — uncomment to split out) ───
  #
  # When you split jobs to a dedicated worker, flip the web service's
  # LOTVIEW_ENABLE_SCHEDULERS to "false" so the queue is only consumed
  # here, preventing duplicate execution.
  #
  # - type: worker
  #   name: lotview-worker
  #   runtime: node
  #   repo: https://github.com/ominous-one/Lotview
  #   branch: main
  #   plan: starter
  #   numInstances: 1
  #   buildCommand: npm ci --ignore-scripts && npm run build
  #   startCommand: node dist/index-worker.js
  #   envVars:
  #     - key: NODE_ENV
  #       value: production
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: lotview-db
  #         property: connectionString
  #     - key: REDIS_URL
  #       fromService:
  #         type: redis
  #         name: lotview-redis
  #         property: connectionString
  #     - key: JWT_SECRET
  #       fromService:
  #         type: web
  #         name: lotview
  #         envVarKey: JWT_SECRET
  #     - key: LOTVIEW_ENABLE_SCHEDULERS
  #       value: "true"
  #     - key: LOTVIEW_SCHEDULER_PROCESS
  #       value: "worker"

databases:
  - name: lotview-db
    databaseName: lotview
    user: lotview
    plan: standard
    ipAllowList: []
    postgresMajorVersion: "16"

redis:
  - name: lotview-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
