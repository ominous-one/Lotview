# Lotview SaaS — Render Blueprint
# Deploy the entire stack to Render.com with one click
#
# Architecture:
#   - Web Service: HTTP API + static files (no schedulers)
#   - Worker: Background jobs + queue processing + scheduled tasks
#   - PostgreSQL: Database
#   - Redis: Cache + sessions + job queues
#
# The worker owns ALL background work (scrapes, Carfax refresh, FB posting, AI,
# GHL sync, re-engagement). The web service only serves HTTP requests.
# This prevents duplicate job execution.

services:
  # ─── Web Service (API + Static Files) ───
  # Serves HTTP only. No schedulers run here.
  - type: web
    name: lotview-api
    runtime: docker
    repo: https://github.com/ominous-one/Lotview
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    env: docker
    plan: standard
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: lotview-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lotview-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: LOTVIEW_ENABLE_SCHEDULERS
        value: "false"
      - key: LOTVIEW_SCHEDULER_PROCESS
        value: "web"
      - key: LOG_FORMAT
        value: "json"
      - key: LOG_LEVEL
        value: "info"
      - key: CORS_ORIGIN
        value: "https://lotview.ai,https://app.lotview.ai,https://www.lotview.ai"
    buildFilter:
      paths:
        - server/**
        - shared/**
        - client/**
        - Dockerfile
        - package.json
        - package-lock.json
        - render.yaml

  # ─── Background Worker (Schedulers + Queue Processing) ───
  # Owns ALL scheduled tasks and background jobs.
  # Prevents duplicate execution by running schedulers only here.
  - type: worker
    name: lotview-worker
    runtime: docker
    repo: https://github.com/ominous-one/Lotview
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    env: docker
    plan: starter
    numInstances: 1
    dockerCommand: node dist/index-worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lotview-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lotview-redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: lotview-api
          envVarKey: JWT_SECRET
      - key: SESSION_SECRET
        fromService:
          type: web
          name: lotview-api
          envVarKey: SESSION_SECRET
      - key: LOTVIEW_ENABLE_SCHEDULERS
        value: "true"
      - key: LOTVIEW_SCHEDULER_PROCESS
        value: "worker"
      - key: LOG_FORMAT
        value: "json"
      - key: LOG_LEVEL
        value: "info"
    buildFilter:
      paths:
        - server/**
        - shared/**
        - Dockerfile
        - package.json
        - package-lock.json
        - render.yaml

databases:
  # ─── PostgreSQL Database ───
  - name: lotview-db
    databaseName: lotview
    user: lotview
    plan: standard
    ipAllowList: []
    postgresMajorVersion: "16"

  # ─── Redis Cache ───
redis:
  - name: lotview-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
