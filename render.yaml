# Lotview SaaS — Render Blueprint
# Deploy the entire stack to Render.com with one click
#
# Usage:
#   1. Push this repo to GitHub
#   2. Connect repo in Render Dashboard → Blueprints
#   3. Render provisions: Web Service + Worker + PostgreSQL + Redis
#
# Or deploy manually:
#   render blueprint apply render.yaml

services:
  # ─── Web Service (API + Static Files) ───
  - type: web
    name: lotview-api
    runtime: docker
    repo: https://github.com/ominous-one/Lotview
    branch: main
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    env: docker
    plan: standard
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: lotview-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lotview-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: LOTVIEW_ENABLE_SCHEDULERS
        value: "true"
      - key: LOTVIEW_SCHEDULER_PROCESS
        value: "web"
      - key: LOG_FORMAT
        value: "json"
      - key: LOG_LEVEL
        value: "info"
      - key: CORS_ORIGIN
        value: "https://lotview.ai,https://app.lotview.ai,https://www.lotview.ai"
    buildFilter:
      paths:
        - server/**
        - shared/**
        - client/**
        - Dockerfile.render
        - package.json

  # ─── Background Worker (Schedulers + Queue Processing) ───
  - type: worker
    name: lotview-worker
    runtime: docker
    repo: https://github.com/ominous-one/Lotview
    branch: main
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    env: docker
    plan: starter
    numInstances: 1
    dockerCommand: node dist/index-worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lotview-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lotview-redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: lotview-api
          envVarKey: JWT_SECRET
      - key: SESSION_SECRET
        fromService:
          type: web
          name: lotview-api
          envVarKey: SESSION_SECRET
      - key: LOTVIEW_ENABLE_SCHEDULERS
        value: "true"
      - key: LOTVIEW_SCHEDULER_PROCESS
        value: "worker"
      - key: LOG_FORMAT
        value: "json"
      - key: LOG_LEVEL
        value: "info"
    buildFilter:
      paths:
        - server/**
        - shared/**
        - Dockerfile.render
        - package.json

  # ─── Cron Job: Daily Inventory Scrape ───
  - type: cron
    name: lotview-daily-scrape
    runtime: docker
    repo: https://github.com/ominous-one/Lotview
    branch: main
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    env: docker
    plan: starter
    schedule: "0 6 * * *"  # 6 AM UTC daily
    dockerCommand: node dist/scripts/run-daily-scrape.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lotview-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lotview-redis
          property: connectionString

  # ─── Cron Job: Hourly Carfax Refresh ───
  - type: cron
    name: lotview-carfax-refresh
    runtime: docker
    repo: https://github.com/ominous-one/Lotview
    branch: main
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    env: docker
    plan: starter
    schedule: "0 * * * *"  # Every hour
    dockerCommand: node dist/scripts/run-carfax-refresh.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lotview-db
          property: connectionString

databases:
  # ─── PostgreSQL Database ───
  - name: lotview-db
    databaseName: lotview
    user: lotview
    plan: standard
    ipAllowList: []
    postgresMajorVersion: "16"

  # ─── Redis Cache ───
redis:
  - name: lotview-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
